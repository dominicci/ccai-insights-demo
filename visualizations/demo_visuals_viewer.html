<!DOCTYPE html>
<html>

<head>
    <title>VeloFit Demo Visuals</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f0f0f0;
            padding: 20px;
        }

        .container {
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 900px;
        }

        h2 {
            color: #333;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
    </style>
</head>

<body>
    <h1>VeloFit Demo Visual Assets</h1>
    <p>Since PNG generation is restricted in the dev environment, use this viewer to inspect your assets. You can take
        screenshots here if needed.</p>

    <div class="container">
        <h2>1. Compliance Trend (The Recovery)</h2>
        <p>Use for Slide 12.</p>
        <img src="demo_compliance_trend.svg" alt="Compliance Trend Chart">
    </div>

    <div class="container">
        <h2>2. Topic Clusters (The Spike)</h2>
        <p>Use for Slide 6.</p>
        <img src="demo_topic_cluster.svg" alt="Topic Cluster Bubble Chart">
    </div>
</body>

</html>
